# Publish to PyPI with Trusted Publishing (OIDC). No long-lived token.
#
# One-time setup:
#   1. PyPI -> Publishing -> Add a pending publisher:
#        Project name:    agentic-bench
#        Owner:           AlibabaResearch
#        Repository:      abench
#        Workflow name:   publish.yml
#        Environment:     (leave blank)
#   2. Optional: a GitHub environment named "pypi" adds a manual-approval
#      gate, but creating one requires repo admin. It is not needed for
#      Trusted Publishing.
#
# Then publish a GitHub Release (tag vX.Y.Z). This workflow builds the
# sdist + wheel from the tagged commit, uploads them to PyPI, and attaches
# the wheel to the GitHub Release.

name: Publish release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the wheel to (e.g. v0.2.0)"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || '' }}

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the release tag matches the package version
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/abench/_version.py)
          test "v${version}" = "${RELEASE_TAG}"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # A retry should still reach the release-asset step if the
          # version was already uploaded.
          skip-existing: true

      - name: Attach the wheel to the GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${RELEASE_TAG}" dist/*.whl --clobber
