# Publish to PyPI with Trusted Publishing (OIDC). No long-lived token.
#
# One-time setup:
#   1. PyPI -> Publishing -> Add a pending publisher:
#        Project name:    agentic-bench
#        Owner:           AlibabaResearch
#        Repository:      abench
#        Workflow name:   publish.yml
#        Environment:     (leave blank)
#   2. Optional: a GitHub environment named "pypi" adds a manual-approval
#      gate, but creating one requires repo admin. It is not needed for
#      Trusted Publishing.
#
# Then publish a GitHub Release (tag vX.Y.Z). This workflow builds the
# sdist + wheel from the tagged commit, uploads them to PyPI, and attaches
# the wheel to the GitHub Release.

name: Publish release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(PYTHONPATH=src python -c 'import abench._version; print(abench._version.__version__)')
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # A retry should still reach the release-asset step if the
          # version was already uploaded.
          skip-existing: true

      - name: Attach the wheel to the GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.whl --clobber
