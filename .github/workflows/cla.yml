name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Explicitly configure permissions in case the repository's default
# GITHUB_TOKEN permissions are read-only.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://gist.github.com/alibaba-oss/151a13b0a72e44ba471119c7eb737d74'
          # The branch must not be protected; signatures are committed here.
          branch: 'main'
          # Add every maintainer's GitHub login here; bots are covered by bot*.
          allowlist: Biaogezi,bot*
